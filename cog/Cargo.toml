[package]
name = "cog"
version = "0.1.0"
edition = "2024"

[features]
steam = ["dep:reqwest", "dep:csv", "dep:serde_json"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
csv = { version = "1.4", optional = true }
dirs = "7.0"
filetime = "0.2"
rayon = "1.8"
regex = "1.12.3"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "query",
    "rustls",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_norway = "0.9.42"
thiserror = "2.0"
toml = "1.0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
