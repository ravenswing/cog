[package]
name = "cog"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
dirs = "7.0"
filetime = "0.2"
rayon = "1.8"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9.42"
thiserror = "2.0"
toml = "1.0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3" # Essential for safely testing file I/O
